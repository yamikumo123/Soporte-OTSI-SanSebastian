
name: CI Soporte OTSI San Sebastian

on:
  push:
    branches:
      - main
      - feature/devops-ci-qa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar estilo con Laravel Pint
        run: ./vendor/bin/pint --test

      - name: Ejecutar pruebas PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
